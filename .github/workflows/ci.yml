name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linting-checks:
    name: "Linting checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run isort
        run: uv run isort --check .

      - name: Run black
        run: uv run black --check .

      - name: Run flake8
        run: uv run flake8

      - name: Run pylint
        run: uv run pylint **/*.py

  unit-tests:
    name: "Unit tests"
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5.13
        env:
          NEO4J_AUTH: neo4j/${{ secrets.NEO4J_TEST_PASSWORD }}
          NEO4J_dbms_memory_pagecache_size: 256M
          NEO4J_dbms_memory_heap_initial__size: 256M
          NEO4J_dbms_memory_heap_max__size: 512M
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ${{ secrets.NEO4J_TEST_PASSWORD }} 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 7687:7687
          - 7474:7474

      neo4j-test:
        image: neo4j:5.13
        env:
          NEO4J_AUTH: neo4j/${{ secrets.NEO4J_TEST_PASSWORD }}
          NEO4J_dbms_memory_pagecache_size: 256M
          NEO4J_dbms_memory_heap_initial__size: 256M
          NEO4J_dbms_memory_heap_max__size: 512M
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ${{ secrets.NEO4J_TEST_PASSWORD }} 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 7688:7687
          - 7475:7474

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e .[test]

      - name: Download model for tests
        run: |
          mkdir -p model_weights/quantized-model
          uv run python scripts/download_model.py --output-dir model_weights/quantized-model

      - name: Run small tests
        run: uv run pytest -rs -vv tests/small/
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ${{ secrets.NEO4J_TEST_PASSWORD }}
          NEO4J_TEST_URI: bolt://localhost:7688
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: ${{ secrets.NEO4J_TEST_PASSWORD }}

      - name: Run medium tests
        run: uv run pytest -rs -vv tests/medium/
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ${{ secrets.NEO4J_TEST_PASSWORD }}
          NEO4J_TEST_URI: bolt://localhost:7688
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: ${{ secrets.NEO4J_TEST_PASSWORD }}

      - name: Run large tests
        run: uv run pytest -rs -vv tests/large/
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ${{ secrets.NEO4J_TEST_PASSWORD }}
          NEO4J_TEST_URI: bolt://localhost:7688
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: ${{ secrets.NEO4J_TEST_PASSWORD }}